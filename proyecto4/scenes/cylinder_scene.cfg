# Standalone finite-cylinder scene.
width=640
height=480
window_xmin=0
window_ymin=0
window_xmax=640
window_ymax=480
output_name=cylinder_demo

eye_x=320
eye_y=240
eye_z=-1000

background_color_a=1
background_color_r=0.015
background_color_g=0.02
background_color_b=0.04
ambient_intensity=0.35

# Vertical plane x=320 divides the cylinder through its central axis.
cut_plane=1 0.5 0 0 -320
# Remove the side facing the camera; keep the half with z>=150.
cut_plane=2 0 0 -1 150

# Vertical cylinder: anchor (320,100,150), axis (0,1,0), radius 85,
# axial range 0..260. Apply cut planes 1 and 2.
object=cylinder 320 100 150 0.2 1 0 85 0 260 1.0 0.95 0.38 0.08 0.8 0.45 0.25 32 1.0 0.0 0.0 cut_planes=2 1 2

light=150 100 -250 1.0 1.0 0.0003 0.000001
light=520 300 -100 0.6 1.0 0.0003 0.000001
