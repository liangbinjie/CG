# Finite positive nappe of a cone with a contrasting background.
width=640
height=480
window_xmin=0
window_ymin=0
window_xmax=640
window_ymax=480
output_name=cone_demo

eye_x=320
eye_y=240
eye_z=-1000

background_color_a=1
background_color_r=0.015
background_color_g=0.02
background_color_b=0.04
ambient_intensity=0.35

# Background panel behind the cone.
object=polygon 4 1.0 0.08 0.16 0.3 0.8 0.6 0 0 300 640 0 300 640 480 300 0 480 300 0 32 1.0 0.0

# Cut off the pointed tip at axial distance d=100; keep the wider side.
cut_plane=1 -0.4472135955 -0.894427191 0 332.55106966

# Tip (320,100,150), axis (0.5,1,0), radius N=90 at distance M=180,
# clipped to the positive axial range [0,260], then tip-cut by plane 1.
object=cone 320 100 150 0.5 1 0 180 90 0 260 1.0 0.95 0.48 0.08 0.8 0.45 0.25 32 1.0 0.0 0.0 cut_planes=1 1

light=150 100 -250 1.0 1.0 0.0003 0.000001
light=520 300 -100 0.6 1.0 0.0003 0.000001
