width=1300
height=700
window_xmin=0
window_ymin=0
window_xmax=1300
window_ymax=700
output_name=earth_scene

eye_x=200
eye_y=400
eye_z=-500

background_color_a=1
background_color_r=0.004
background_color_g=0.008
background_color_b=0.025
ambient_intensity=0.12

# Starfield fills the camera view and ignores cast shadows from the planet.
object=polygon 4 1.0 1.0 1.0 1.0 0.65 1.0 -350 -650 820 3100 -650 820 3100 1190 820 -350 1190 820 0.2 24 1.0 0.0 2 receives_shadows=0

object=sphere 452 274 260 1.0 1.0 1.0 1.0 175 0.8 0.15 0.25 24 1.0 0.0 0.0 11
# Smaller Moon, offset to the upper right of Earth, using texture ID 12.
object=sphere 820 180 260 1.0 1.0 1.0 1.0 30 0.8 0.15 0.25 24 1.0 0.0 0.0 12

# Distant, unattenuated point light approximates sunlight and leaves a clear
# dark hemisphere on the side of Earth facing away from it.
light=-1600 -1000 -2200 1.0 1.0 0.0 0.0
